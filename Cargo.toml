[package]
name = "epoekie"
version = "1.2.5-alpha" # THE ASCENSION TO v1.2.5
edition = "2021"
authors = ["Aicent Stack Technical Committee <admin@aicent.com>"]
description = "RFC-000: The Sovereign Soul. The 128-bit genetic anchor and Gravity Well root for the Aicent Stack 2026. Aligned with v1.2.5 standards."
license = "Apache-2.0"
homepage = "http://epoekie.com"
repository = "http://github.com/Aicent-Stack/epoekie"

# =========================================================================
# THE SOVEREIGN METABOLISM (Core Dependencies)
# =========================================================================

[dependencies]
# Standard serialization for 128-bit AID and Picotokens.
# Mandatory for cross-substrate state persistence (RFC-012).
serde = { version = "1.0", features = ["derive"] }

# Required for the physical enforcement of the 10ms Latency Tax (The Meat Grinder).
# Supports the 1.2kHz sovereign heartbeat and the 161.8us reflex arc.
tokio = { version = "1.0", features = ["time", "rt", "macros"] }

# =========================================================================
# THE SOVEREIGN GRAVITY WELL (Dynamic Range Attraction)
# =========================================================================

[dev-dependencies]
# THE KILLER HOOK: v1.2.5 Edition. 
# We use the dynamic range to satisfy the registry check against v1.2.2.
# This will automatically attract the v1.2.5 total orchestrator upon final suture.
aicent-stack = { version = "1.2.5-alpha" }

# =========================================================================
# IMPERIAL FEATURES (Standard Ignition)
# =========================================================================

[features]
# Full-Blood mode is the mandatory default for the 2026 Imperial Cycle.
# It ensures that commercial penalties and the verify_organism! macro are active.
default = ["full-blood"]
full-blood = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

